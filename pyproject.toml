[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qera"
version = "0.1.1"
description = "Q-ERA adaptive multi-scenario routing experiment"
requires-python = ">=3.11,<3.14"
dependencies = [
  "classiq==1.29.0",
  "matplotlib==3.11.1",
  "networkx==3.6.1",
  "numpy==2.5.2",
  "pandas==2.3.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qera*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
